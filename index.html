<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ekkles OS | Painel Administrativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-ativa { background: #dcfce7; color: #166534; }
        .status-bloqueada { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div class="max-w-6xl mx-auto p-4 md:p-6">
        <header class="flex flex-wrap justify-between items-center mb-8 gap-4">
            <h1 class="text-2xl font-bold text-indigo-700">Ekkles OS</h1>
            <button onclick="limparDados()" class="text-sm text-slate-500 hover:underline">Limpar exemplos</button>
        </header>
        <section id="stats" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
                <p class="text-sm text-slate-500">Igrejas Ativas</p>
                <p id="count-ativas" class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
                <p class="text-sm text-slate-500">Bloqueadas</p>
                <p id="count-bloqueadas" class="text-2xl font-bold">0</p>
            </div>
            <div class="bg-white p-4 rounded-lg shadow-sm border border-slate-200">
                <p class="text-sm text-slate-500">Receita Estimada</p>
                <p id="revenue" class="text-2xl font-bold">R$ 0,00</p>
            </div>
        </section>
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 border-b">
                        <tr>
                            <th class="p-3">Igreja</th>
                            <th class="p-3">Plano</th>
                            <th class="p-3">Vencimento</th>
                            <th class="p-3">Status</th>
                            <th class="p-3 text-right">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="church-list"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        const INITIAL_DATA = [
            { id: 1, nome: "Primeira Batista", plano: "Premium", vencimento: "2026-10-25", status: "ativa" },
            { id: 2, nome: "Comunidade da Fé", plano: "Pro", vencimento: "2026-10-20", status: "bloqueada" },
            { id: 3, nome: "Igreja do Avivamento", plano: "Premium", vencimento: "2026-11-05", status: "ativa" },
            { id: 4, nome: "Missão Global", plano: "Pro", vencimento: "2026-10-22", status: "ativa" },
            { id: 5, nome: "Templo da Graça", plano: "Basic", vencimento: "2026-09-15", status: "bloqueada" }
        ];
        function render() {
            const data = JSON.parse(localStorage.getItem('ekkles_data')) || INITIAL_DATA;
            const tbody = document.getElementById('church-list');
            tbody.innerHTML = '';
            
            let ativas = 0, bloqueadas = 0, receita = 0;
            data.forEach(item => {
                if(item.status === 'ativa') { ativas++; receita += 89; } else { bloqueadas++; }
                
                tbody.innerHTML += `
                    <tr class="border-b">
                        <td class="p-3 font-medium">${item.nome}</td>
                        <td class="p-3">${item.plano}</td>
                        <td class="p-3">${item.vencimento}</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs uppercase status-${item.status}">${item.status}</span></td>
                        <td class="p-3 text-right">
                            <button onclick="toggleStatus(${item.id})" class="text-indigo-600 hover:underline">Alternar</button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('count-ativas').innerText = ativas;
            document.getElementById('count-bloqueadas').innerText = bloqueadas;
            document.getElementById('revenue').innerText = `R$ ${receita},00`;
        }
        function toggleStatus(id) {
            let data = JSON.parse(localStorage.getItem('ekkles_data')) || INITIAL_DATA;
            data = data.map(i => i.id === id ? {...i, status: i.status === 'ativa' ? 'bloqueada' : 'ativa'} : i);
            localStorage.setItem('ekkles_data', JSON.stringify(data));
            render();
        }
        function limparDados() {
            localStorage.removeItem('ekkles_data');
            render();
        }
        render();
    </script>
</body>
</html>
