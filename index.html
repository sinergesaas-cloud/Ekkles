<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ekkles OS | Painel Administrativo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.st-ativa{background:#dcfce7;color:#166534}
.st-bloqueada{background:#fee2e2;color:#991b1b}
.st-vencendo{background:#fef9c3;color:#854d0e}
.st-cancelada{background:#e2e8f0;color:#334155}
</style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

<!-- TELA DE LOGIN -->
<div id="login" class="min-h-screen flex items-center justify-center p-4">
  <form id="form-login" class="bg-white p-6 rounded-lg shadow-md w-full max-w-sm space-y-4">
    <div>
      <h1 class="text-2xl font-bold text-indigo-700">Ekkles OS</h1>
      <p class="text-xs text-slate-500">Painel de Gestão e Licenciamento</p>
    </div>
    <input id="l-email" type="email" required placeholder="E-mail do Administrador" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
    <input id="l-senha" type="password" required placeholder="Senha" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded p-2 font-medium text-sm transition">Entrar</button>
    <p id="l-erro" class="text-sm text-red-600 text-center"></p>
  </form>
</div>

<!-- PAINEL ADMINISTRATIVO -->
<div id="app" class="hidden max-w-6xl mx-auto p-4 md:p-6">
  <header class="flex flex-wrap justify-between items-center gap-3 mb-6 bg-white p-4 rounded-lg shadow-sm border">
    <div>
      <h1 class="text-xl font-bold text-indigo-700">Ekkles OS <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded-full">Admin</span></h1>
    </div>
    <button id="btn-sair" class="text-sm text-slate-500 hover:text-red-600 transition font-medium">Sair do Sistema</button>
  </header>

  <!-- MÉTRICAS -->
  <section class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div class="bg-white p-4 rounded-lg shadow-sm border"><p class="text-sm text-slate-500">Igrejas ativas</p><p id="c-ativas" class="text-2xl font-bold text-emerald-600">0</p></div>
    <div class="bg-white p-4 rounded-lg shadow-sm border"><p class="text-sm text-slate-500">Bloqueadas / Inadimplentes</p><p id="c-bloq" class="text-2xl font-bold text-red-600">0</p></div>
    <div class="bg-white p-4 rounded-lg shadow-sm border"><p class="text-sm text-slate-500">Receita mensal estimada</p><p id="c-receita" class="text-2xl font-bold text-slate-800">R$ 0,00</p></div>
  </section>

  <!-- FORMULÁRIO DE CADASTRO -->
  <form id="form-igreja" class="bg-white p-4 rounded-lg shadow-sm border mb-6 grid grid-cols-1 md:grid-cols-5 gap-3">
    <div class="md:col-span-5 pb-2 border-b">
      <h2 class="font-semibold text-sm text-slate-700">Cadastrar Nova Igreja / Assinatura</h2>
    </div>
    <input id="f-nome" required placeholder="Nome da igreja" class="border rounded p-2 text-sm md:col-span-2">
    <input id="f-resp" placeholder="Responsável/Pastor" class="border rounded p-2 text-sm">
    <input id="f-email" type="email" placeholder="E-mail de contato" class="border rounded p-2 text-sm">
    <select id="f-plano" required class="border rounded p-2 text-sm bg-white"></select>
    <input id="f-venc" type="date" required class="border rounded p-2 text-sm">
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded p-2 font-medium text-sm md:col-span-5 transition">Cadastrar e Ativar Igreja</button>
  </form>

  <!-- TABELA DE CLIENTES -->
  <div class="bg-white rounded-lg shadow-sm border overflow-x-auto">
    <table class="w-full text-left text-sm min-w-[640px]">
      <thead class="bg-slate-100 border-b text-slate-600">
        <tr>
          <th class="p-3">Igreja</th>
          <th class="p-3">Plano</th>
          <th class="p-3">Vencimento</th>
          <th class="p-3">Status</th>
          <th class="p-3 text-right">Ações</th>
        </tr>
      </thead>
      <tbody id="lista"></tbody>
    </table>
  </div>
  <p id="msg" class="text-sm text-red-600 mt-3 text-center font-medium"></p>
</div>

<script>
const SUPABASE_URL = 'https://txtuitlxljyzfbzlpsou.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR4dHVpdGx4bGp5emZiemxwc291Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTgwODUsImV4cCI6MjEwODI3NDA4NX0.M7UpeRXDpN37SCLczeS2WNTgG1vm9szlSSMtBc253XM';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const brl = v => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function mostrarErro(texto) { $('msg').textContent = texto || ''; }

$('form-login').addEventListener('submit', async e => {
  e.preventDefault();
  $('l-erro').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('l-email').value, password: $('l-senha').value });
  if (error) { $('l-erro').textContent = 'E-mail ou senha incorretos.'; return; }
  mostrarApp();
});

$('btn-sair').addEventListener('click', async () => {
  await sb.auth.signOut();
  location.reload();
});

async function mostrarApp() {
  $('login').classList.add('hidden');
  $('app').classList.remove('hidden');
  await carregarPlanos();
  await carregar();
}

async function carregarPlanos() {
  const { data, error } = await sb.from('plans').select('*').order('preco_mensal');
  if (error) { mostrarErro('Erro ao carregar planos: ' + error.message); return; }
  $('f-plano').innerHTML = data.map(p => `<option value="${esc(p.id)}">${esc(p.nome)} (${brl(p.preco_mensal)}/mês)</option>`).join('');
}

async function carregar() {
  const { data, error } = await sb.from('subscriptions')
    .select('id, status, vencimento, church_id, plan_id, churches(nome), plans(nome, preco_mensal)')
    .order('vencimento');
  if (error) { mostrarErro('Erro ao carregar assinaturas: ' + error.message); return; }
  mostrarErro('');
  render(data || []);
}

function render(lista) {
  let ativas = 0, bloq = 0, receita = 0;
  lista.forEach(s => {
    if (s.status === 'ativa') { ativas++; receita += Number(s.plans?.preco_mensal || 0); }
    if (s.status === 'bloqueada') bloq++;
  });
  $('c-ativas').textContent = ativas;
  $('c-bloq').textContent = bloq;
  $('c-receita').textContent = brl(receita);

  $('lista').innerHTML = lista.map(s => `
    <tr class="border-b hover:bg-slate-50/50">
      <td class="p-3 font-medium">${esc(s.churches?.nome)}</td>
      <td class="p-3 text-slate-600">${esc(s.plans?.nome)}</td>
      <td class="p-3 text-slate-600">${esc(s.vencimento)}</td>
      <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold uppercase st-${esc(s.status)}">${esc(s.status)}</span></td>
      <td class="p-3 text-right whitespace-nowrap space-x-2">
        <button onclick="window.alternar('${s.id}','${s.status}')" class="text-indigo-600 hover:text-indigo-800 font-medium">Alternar</button>
        <button onclick="window.renovar('${s.id}','${s.plan_id}','${s.vencimento}')" class="text-emerald-700 hover:text-emerald-900 font-medium">Renovar +30d</button>
        <button onclick="window.excluir('${s.church_id}')" class="text-red-600 hover:text-red-800 font-medium">Excluir</button>
      </td>
    </tr>`).join('');
}

$('form-igreja').addEventListener('submit', async e => {
  e.preventDefault();
  const { data: igreja, error: e1 } = await sb.from('churches')
    .insert({ nome: $('f-nome').value, responsavel: $('f-resp').value || null, email: $('f-email').value || null })
    .select().single();
  if (e1) { mostrarErro('Erro ao cadastrar igreja: ' + e1.message); return; }
  
  const { error: e2 } = await sb.from('subscriptions')
    .insert({ church_id: igreja.id, plan_id: $('f-plano').value, status: 'ativa', vencimento: $('f-venc').value });
  if (e2) { mostrarErro('Erro ao criar assinatura: ' + e2.message); return; }
  
  e.target.reset();
  await carregar();
});

// Funções expostas globalmente para os botões da tabela
window.alternar = async function(id, statusAtual) {
  const novo = statusAtual === 'ativa' ? 'bloqueada' : 'ativa';
  const { error } = await sb.from('subscriptions').update({ status: novo }).eq('id', id);
  if (error) { mostrarErro('Erro ao alterar status: ' + error.message); return; }
  await carregar();
};

window.renovar = async function(id, planId, vencimento) {
  const baseDate = vencimento ? new Date(vencimento + 'T00:00:00') : new Date();
  if (isNaN(baseDate)) baseDate = new Date();
  baseDate.setDate(baseDate.getDate() + 30);
  const novoVenc = baseDate.toISOString().slice(0, 10);

  const { data: plano } = await sb.from('plans').select('preco_mensal').eq('id', planId).single();
  const { error } = await sb.from('subscriptions').update({ status: 'ativa', vencimento: novoVenc }).eq('id', id);
  if (error) { mostrarErro('Erro ao renovar: ' + error.message); return; }
  
  await sb.from('payments').insert({ subscription_id: id, valor: plano?.preco_mensal || 0, metodo: 'manual' });
  await carregar();
};

window.excluir = async function(churchId) {
  if (!confirm('Tem certeza que deseja excluir esta igreja, suas assinaturas e dados vinculados?')) return;
  const { error } = await sb.from('churches').delete().eq('id', churchId);
  if (error) { mostrarErro('Erro ao excluir: ' + error.message); return; }
  await carregar();
};

// Checa sessão ao iniciar
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) mostrarApp();
})();
</script>
</body>
</html>
